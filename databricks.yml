# PriceWise — Declarative Automation Bundle (Databricks Asset Bundle)
# Deploys the FastAPI + static UI as a Databricks App.
# The app source lives in ./app (which contains app.yaml, requirements.txt, server/, static/).

bundle:
  name: pricewise

resources:
  apps:
    pricewise_app:
      name: "pricewise"
      source_code_path: ./app          # folder containing app.yaml + the app code
      description: "PriceWise — demand-aware pricing & smart search on Lakebase"
      # Grant the app's service principal access to the resources it needs.
      # (The app reads the pricewise-db Lakebase project and the embedding serving endpoint.)
      permissions:
        - level: CAN_USE
          group_name: users

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9d25a17d-f58c.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-9d25a17d-f58c.cloud.databricks.com
      root_path: /Workspace/Users/Sudipto.Banerjee@data-axle.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: Sudipto.Banerjee@data-axle.com
        level: CAN_MANAGE
