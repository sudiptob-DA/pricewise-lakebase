bundle:
  name: pricewise

resources:
  apps:
    pricewise_app:
      name: "pricewise"
      source_code_path: ./app
      description: "PriceWise — demand-aware pricing & smart search on Lakebase"
      user_api_scopes:
        - sql
        - model-serving
        - genie
        - postgres
        - "catalog.catalogs:read"
        - "catalog.schemas:read"
        - "catalog.tables:read"
      resources:
        - name: database
          postgres:
            branch: projects/pricewise-db/branches/production
            database: projects/pricewise-db/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: embedding-endpoint
          serving_endpoint:
            name: databricks-gte-large-en
            permission: CAN_QUERY
        - name: genie-space
          genie_space:
            name: "PriceWise Analytics"
            space_id: "01f1bdd0b16c164789517b59f5ede336"
            permission: CAN_MANAGE
      permissions:
        - level: CAN_USE
          group_name: users

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-9d25a17d-f58c.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-9d25a17d-f58c.cloud.databricks.com
      root_path: /Workspace/Users/Sudipto.Banerjee@data-axle.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: Sudipto.Banerjee@data-axle.com
        level: CAN_MANAGE