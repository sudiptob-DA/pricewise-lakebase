<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#00A972"/></marker>
    <marker id="al" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FF3621"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2272B4"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFAB00"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="6.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8E6FD8"/></marker>
  </defs>

  <rect width="1440" height="980" fill="#F7F5F1"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1B3139">PriceWise — architecture</text>
  <text x="40" y="74" font-size="14" fill="#8A96A3">Demand-aware pricing &amp; smart search on Databricks Lakebase · Track 2</text>

  <!-- legend: one row, each color maps to exactly one kind of arrow -->
  <g font-size="12.5" fill="#3A4A52">
    <rect x="40"   y="98" width="22" height="10" rx="5" fill="#00A972"/><text x="70"   y="107">Lakehouse build &amp; ingest</text>
    <rect x="250"  y="98" width="22" height="10" rx="5" fill="#8E6FD8"/><text x="280"  y="107">Reverse ETL · Synced Tables (UC → Lakebase)</text>
    <rect x="610"  y="98" width="22" height="10" rx="5" fill="#FF3621"/><text x="640"  y="107">Real-time serving &amp; app writes (&lt;200ms)</text>
    <rect x="920"  y="98" width="22" height="10" rx="5" fill="#2272B4"/><text x="950"  y="107">Lakebase CDF (Lakebase → UC)</text>
    <rect x="1180" y="98" width="22" height="10" rx="5" fill="#FFAB00"/><text x="1210" y="107">User traffic</text>
  </g>

  <!-- band labels -->
  <text x="40" y="168" font-size="12.5" font-weight="700" fill="#8A96A3" letter-spacing="0.5">SOURCES</text>
  <text x="40" y="312" font-size="12.5" font-weight="700" fill="#8A96A3" letter-spacing="0.5">LAKEHOUSE · Unity Catalog · notebook ETL</text>
  <text x="40" y="574" font-size="12.5" font-weight="700" fill="#8A96A3" letter-spacing="0.5">LAKEBASE · serverless Postgres</text>
  <text x="40" y="820" font-size="12.5" font-weight="700" fill="#8A96A3" letter-spacing="0.5">APP · Databricks App (FastAPI + static UI)</text>

  <!-- =============================== SOURCES =============================== -->
  <g>
    <rect x="48" y="180" width="220" height="78" rx="12" fill="#F0EDE6" stroke="#E4E0D8"/>
    <text x="68" y="210" font-size="13.5" font-weight="700" fill="#1B3139">samples.wanderbricks</text>
    <text x="68" y="230" font-size="11" fill="#8A96A3">18k stays · reviews · bookings</text>
    <text x="68" y="246" font-size="11" fill="#8A96A3">clickstream · destinations</text>

    <rect x="300" y="180" width="180" height="78" rx="12" fill="#F0EDE6" stroke="#E4E0D8"/>
    <text x="320" y="214" font-size="13.5" font-weight="700" fill="#1B3139">FX rates</text>
    <text x="320" y="236" font-size="11" fill="#8A96A3">cross-border demand</text>

    <rect x="512" y="180" width="190" height="78" rx="12" fill="#F0EDE6" stroke="#E4E0D8"/>
    <text x="532" y="214" font-size="13.5" font-weight="700" fill="#1B3139">Public holidays</text>
    <text x="532" y="236" font-size="11" fill="#8A96A3">holiday demand</text>
  </g>

  <!-- =============================== LAKEHOUSE ============================= -->
  <g>
    <rect x="48" y="328" width="240" height="178" rx="12" fill="#FFF" stroke="#E4E0D8"/>
    <text x="68" y="356" font-size="13.5" font-weight="700" fill="#1B3139">Bronze → Silver → Gold</text>
    <text x="68" y="378" font-size="11" fill="#8A96A3">Notebooks (medallion ETL)</text>
    <text x="68" y="398" font-size="11" fill="#8A96A3">season + demand + FX + holiday</text>
    <text x="68" y="414" font-size="11" fill="#8A96A3">uplift → 12-mo pricing curve</text>
    <text x="68" y="440" font-size="11" fill="#1B3139" font-weight="700">gold_property_features</text>
    <text x="68" y="460" font-size="11" fill="#1B3139" font-weight="700">serve_property_pricing</text>
    <text x="68" y="480" font-size="11" fill="#8A96A3">(UC Delta → Synced Table)</text>

    <rect x="320" y="328" width="220" height="178" rx="12" fill="#FFF" stroke="#E4E0D8"/>
    <text x="340" y="356" font-size="13.5" font-weight="700" fill="#1B3139">Model Serving</text>
    <text x="340" y="378" font-size="11" fill="#8A96A3">embed descriptions</text>
    <text x="340" y="398" font-size="11" fill="#8A96A3">Foundation Model API</text>
    <text x="340" y="414" font-size="11" fill="#8A96A3">databricks-gte-large-en</text>
    <text x="340" y="430" font-size="11" fill="#8A96A3">1024-dim embeddings</text>

    <rect x="572" y="328" width="220" height="178" rx="12" fill="#EAF1F6" stroke="#cfe0ea"/>
    <text x="592" y="356" font-size="13.5" font-weight="700" fill="#1B3139">Genie (Conversation API)</text>
    <text x="592" y="378" font-size="11" fill="#8A96A3">text-to-SQL over</text>
    <text x="592" y="394" font-size="11" fill="#8A96A3">v_underpricing,</text>
    <text x="592" y="410" font-size="11" fill="#8A96A3">v_market_by_destination,</text>
    <text x="592" y="426" font-size="11" fill="#8A96A3">gold_property_features</text>
    <text x="592" y="448" font-size="11" fill="#8A96A3">in-app chat · logged to app_data</text>
    <text x="592" y="464" font-size="11" fill="#8A96A3">(Revenue Insights)</text>

    <rect x="1016" y="328" width="240" height="178" rx="12" fill="#EAF1F6" stroke="#cfe0ea"/>
    <text x="1036" y="356" font-size="13.5" font-weight="700" fill="#1B3139">UC Delta history</text>
    <text x="1036" y="378" font-size="11" fill="#8A96A3">pricing_decisions_history +</text>
    <text x="1036" y="394" font-size="11" fill="#8A96A3">genie_conversations_history</text>
    <text x="1036" y="410" font-size="11" fill="#8A96A3">(CDF output · SCD2)</text>
    <text x="1036" y="434" font-size="11" fill="#8A96A3">_pg_change_type</text>
    <text x="1036" y="452" font-size="11" fill="#8A96A3">decisions + agent memory → analytics</text>
  </g>

  <!-- =============================== LAKEBASE ============================= -->
  <g>
    <!-- public schema (Synced Table from UC, no CDF) -->
    <rect x="48" y="590" width="288" height="168" rx="12" fill="#1B3139"/>
    <text x="68" y="618" font-size="12.5" font-weight="700" fill="#FFAB00">schema: public  (Synced from UC — no CDF)</text>
    <text x="68" y="648" font-size="13" font-weight="700" fill="#fff">serve_property_pricing_synced</text>
    <text x="68" y="668" font-size="11" fill="#B9C4CA">Synced Table from UC Delta</text>
    <text x="68" y="685" font-size="11" fill="#B9C4CA">prices served &lt;200ms</text>
    <text x="68" y="712" font-size="11" fill="#B9C4CA">read-only replica · refreshed</text>
    <text x="68" y="729" font-size="11" fill="#B9C4CA">by Reverse ETL from gold</text>

    <!-- data_axle schema (app's native OLTP + search tables) -->
    <rect x="356" y="590" width="324" height="168" rx="12" fill="#1B3139"/>
    <text x="376" y="618" font-size="12.5" font-weight="700" fill="#00A972">schema: data_axle  (native search + OLTP)</text>
    <text x="376" y="646" font-size="13" font-weight="700" fill="#fff">properties</text>
    <text x="376" y="664" font-size="11" fill="#B9C4CA">vector + text (BM25) + PostGIS geo</text>
    <text x="376" y="679" font-size="11" fill="#B9C4CA">hybrid search (RRF) in 1 ACID query</text>
    <text x="376" y="706" font-size="13" font-weight="700" fill="#fff">property_pricing · saved_properties</text>
    <text x="376" y="724" font-size="11" fill="#B9C4CA">pricing lookups · user saves</text>

    <!-- app_data schema (data OUT, CDF on) -->
    <rect x="700" y="590" width="420" height="168" rx="12" fill="#1B3139"/>
    <text x="720" y="616" font-size="12.5" font-weight="700" fill="#2272B4">schema: app_data  (data flowing OUT — CDF on)</text>
    <text x="720" y="642" font-size="13" font-weight="700" fill="#fff">pricing_decisions</text>
    <text x="720" y="660" font-size="11" fill="#B9C4CA">host Accept / Override writes · applied price</text>
    <text x="720" y="690" font-size="13" font-weight="700" fill="#fff">genie_conversations</text>
    <text x="720" y="708" font-size="11" fill="#B9C4CA">agent memory · question · SQL · tables · latency</text>
    <text x="720" y="724" font-size="11" fill="#B9C4CA">powers Revenue-Insights history &amp; stats</text>
    <text x="720" y="744" font-size="11" fill="#B9C4CA">both created lazily · no circular sync</text>
  </g>

  <!-- =============================== APP ================================== -->
  <g>
    <rect x="48" y="836" width="520" height="104" rx="12" fill="#FFF1EE" stroke="#FF3621"/>
    <text x="68" y="866" font-size="13.5" font-weight="700" fill="#1B3139">FastAPI + static UI</text>
    <text x="68" y="888" font-size="11" fill="#3A4A52">Market Search (semantic toggle) · Pricing Studio (waterfall,</text>
    <text x="68" y="906" font-size="11" fill="#3A4A52">12-mo curve, comps, Accept/Override) · Revenue Insights (Genie chat + history)</text>
    <text x="68" y="928" font-size="11" fill="#8A96A3">psycopg via generate_database_credential() · reads public, writes app_data</text>

    <rect x="600" y="836" width="180" height="104" rx="12" fill="#FFF" stroke="#E4E0D8"/>
    <text x="620" y="866" font-size="13.5" font-weight="700" fill="#1B3139">Hosts</text>
    <text x="620" y="888" font-size="11" fill="#8A96A3">search market</text>
    <text x="620" y="906" font-size="11" fill="#8A96A3">see &amp; apply price</text>
    <text x="620" y="928" font-size="11" fill="#8A96A3">capture peak demand</text>
  </g>

  <!-- =============================== FLOWS ================================ -->
  <!-- GREEN · sources -> gold (ingest). Clear vertical lanes in the 258–328 gap. -->
  <path d="M158,258 L158,328" fill="none" stroke="#00A972" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M390,258 C390,296 300,296 230,326" fill="none" stroke="#00A972" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M607,258 C607,300 320,300 250,326" fill="none" stroke="#00A972" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- GREEN · gold -> model serving, gold -> genie (horizontal, inside lakehouse band) -->
  <path d="M288,398 L320,398" fill="none" stroke="#00A972" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M540,410 L572,410" fill="none" stroke="#00A972" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- PURPLE · Reverse ETL: gold serve_property_pricing -> public.serve_property_pricing_synced -->
  <path d="M165,506 L165,590" fill="none" stroke="#8E6FD8" stroke-width="3" marker-end="url(#ap)"/>
  <text x="178" y="552" font-size="12" font-weight="700" fill="#8E6FD8">Reverse ETL · Synced Table</text>

  <!-- GREEN · Model Serving embeddings -> data_axle.properties (search index build) -->
  <path d="M430,506 C430,548 470,548 490,588" fill="none" stroke="#00A972" stroke-width="2.6" marker-end="url(#ag)"/>
  <text x="440" y="552" font-size="11.5" font-weight="700" fill="#00A972">embeddings → properties</text>

  <!-- RED · public (prices) + data_axle (search) -> app (fast reads) -->
  <path d="M180,758 C180,795 200,800 215,834" fill="none" stroke="#FF3621" stroke-width="3" marker-end="url(#al)"/>
  <path d="M500,758 C500,795 320,800 265,834" fill="none" stroke="#FF3621" stroke-width="3" marker-end="url(#al)"/>
  <text x="150" y="800" font-size="12" font-weight="700" fill="#FF3621">&lt;200ms reads (prices + search)</text>

  <!-- RED · app -> app_data (Accept/Override writes + Genie turns) -->
  <path d="M568,884 C650,850 780,800 850,760" fill="none" stroke="#FF3621" stroke-width="3" marker-end="url(#al)"/>
  <text x="596" y="812" font-size="12" font-weight="700" fill="#FF3621">Accept/Override + Genie-chat writes</text>

  <!-- BLUE · CDF: app_data -> UC Delta history -->
  <path d="M1030,590 C1070,555 1100,535 1125,508" fill="none" stroke="#2272B4" stroke-width="3" marker-end="url(#ab)"/>
  <text x="1030" y="560" font-size="12" font-weight="700" fill="#2272B4">Lakebase CDF (SCD2)</text>

  <!-- BLUE · UC Delta history -> Genie (analytics source) -->
  <path d="M1016,420 L792,420" fill="none" stroke="#2272B4" stroke-width="2.4" marker-end="url(#ab)"/>

  <!-- GREEN (faint) · Genie -> app (Revenue Insights) -->
  <path d="M640,506 C640,680 560,760 360,834" fill="none" stroke="#00A972" stroke-width="2" opacity="0.45" marker-end="url(#ag)"/>

  <!-- AMBER · hosts -> app (user traffic) -->
  <path d="M600,888 L568,888" fill="none" stroke="#FFAB00" stroke-width="3" marker-end="url(#ao)"/>

  <text x="40" y="958" font-size="10.5" fill="#8A96A3">Sources: FX rates (frankfurter.dev) · Public holidays (date.nager.at) · samples.wanderbricks</text>
  <text x="40" y="974" font-size="11" fill="#8A96A3">Lakebase Search (hybrid) · Reverse ETL (live prices) · Lakebase CDF (write-back) · Genie in-app chat + persisted history · Foundation Model API · Databricks Apps</text>
</svg>
