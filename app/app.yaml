# Databricks Apps entrypoint for PriceWise.
# Runs the FastAPI backend (which also serves the static UI at /).
command:
  - "uvicorn"
  - "server.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: LAKEBASE_PROJECT
    value: "pricewise-db"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
  - name: EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  # Full URL to your Genie space. The Revenue Insights tab links to it ("Open in Genie").
  - name: GENIE_SPACE_URL
    value: "https://dbc-9d25a17d-f58c.cloud.databricks.com/genie/rooms/01f1bdd0b16c164789517b59f5ede336"
