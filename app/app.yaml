# Databricks Apps entrypoint for PriceWise.
# Runs the FastAPI backend (which also serves the static UI at /).
command:
  - "uvicorn"
  - "server.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: LAKEBASE_PROJECT
    value: "pricewise-db"
  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"
  - name: EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  # Full URL to your Genie space, e.g. https://<workspace>/genie/rooms/<space_id>
  # Set this after you create the space; the Revenue Insights tab embeds it.
  - name: GENIE_SPACE_URL
    value: ""
